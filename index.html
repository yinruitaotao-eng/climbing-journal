<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派大涛·攀岩修炼</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#0B0F1A;--espresso:#F0EDE6;--sage:#D4A853;--sage-light:#E8C97A;
  --stone:#8B8578;--sand:#2A3040;--sand-light:#141B2D;
  --bg:var(--cream);--bg2:#0F1525;--bg3:var(--sand-light);
  --text:var(--espresso);--text2:#A09888;--text3:var(--stone);
  --accent:var(--sage);--accent-bg:rgba(212,168,83,.10);
  --border:rgba(212,168,83,.10);--shadow-s:0 1px 8px rgba(0,0,0,.2);
  --shadow-m:0 4px 24px rgba(0,0,0,.3);--shadow-l:0 12px 48px rgba(0,0,0,.4);
  --serif:-apple-system,'SF Pro Display','SF Pro Text','PingFang SC','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
  --sans:-apple-system,'SF Pro Text','SF Pro Display','PingFang SC','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
  --mastered:var(--sage);--practicing:#E8735A;--locked:var(--sand);--teal:#4ECDC4;--plum:#A78BFA;
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-out-quart:cubic-bezier(0.25,1,0.5,1);
}
[data-theme="dark"]{
  --cream:#080C16;--espresso:#F0EDE6;--sand-light:#111828;
  --bg:var(--cream);--bg2:#0C1220;--bg3:var(--sand-light);
  --text:var(--espresso);--text2:#A09888;--text3:#6B665E;
  --border:rgba(212,168,83,.08);--shadow-s:0 1px 8px rgba(0,0,0,.3);
  --shadow-m:0 4px 24px rgba(0,0,0,.4);--shadow-l:0 12px 48px rgba(0,0,0,.5);
  --accent-bg:rgba(212,168,83,.08);
}
html{scroll-behavior:smooth;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-family:var(--sans);font-size:16px;line-height:1.7;transition:background .6s var(--ease-out-expo),color .6s var(--ease-out-expo)}
body{min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}

/* NOISE OVERLAY */
body::before{content:'';position:fixed;inset:0;z-index:50;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  opacity:.4}

/* NAV - Floating Island */
.nav{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:32px;padding:12px 28px;
  background:rgba(11,15,26,.80);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--border);border-radius:100px;
  box-shadow:var(--shadow-s);transition:all .5s var(--ease-out-expo)}
[data-theme="dark"] .nav{background:rgba(8,12,22,.85)}
.nav.scrolled{top:16px;box-shadow:var(--shadow-m)}
.nav-brand{font-family:var(--serif);font-size:14px;font-weight:400;letter-spacing:.04em;color:var(--text2)}
.nav-right{display:flex;align-items:center;gap:24px}
.nav-right a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-weight:500;transition:color .3s var(--ease-out-expo);cursor:pointer}
.nav-right a:hover{color:var(--text)}
.nav-right a.active{color:var(--accent)}
.theme-btn{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--text3);
  font-size:14px;display:flex;align-items:center;justify-content:center;transition:color .3s var(--ease-out-expo)}
.theme-btn:hover{color:var(--text)}

/* COVER */
.cover{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:80px 32px 60px;text-align:center;position:relative;overflow:hidden}
.cover::before{content:'';position:absolute;inset:-60px;
  background:url('https://images.unsplash.com/photo-1522163182402-834f871fd851?w=1920&q=80') center/cover no-repeat;
  filter:blur(30px) brightness(.35) saturate(1.2);transform:scale(1.1);z-index:0}
.cover::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,15,26,.3) 0%,rgba(11,15,26,.7) 60%,var(--cream) 100%);z-index:1}
.cover>*{position:relative;z-index:2}
.cover-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-size:clamp(200px,35vw,400px);font-weight:700;
  color:var(--accent);opacity:.06;pointer-events:none;letter-spacing:-.05em;z-index:1}
.cover-eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--stone);
  font-weight:500;margin-bottom:32px;opacity:0;transform:translateY(20px);animation:fadeUp .8s var(--ease-out-expo) .2s forwards}
.cover h1{font-family:var(--serif);font-size:clamp(48px,10vw,96px);font-weight:400;
  letter-spacing:-.03em;line-height:1;margin-bottom:40px;color:var(--text);
  opacity:0;transform:translateY(30px);animation:fadeUp 1s var(--ease-out-expo) .4s forwards}
.cover-line{width:48px;height:1px;background:var(--accent);opacity:.4;margin:0 auto 40px;
  opacity:0;transform:scaleX(0);animation:scaleX 1s var(--ease-out-expo) .6s forwards}
.cover-quote{font-family:var(--serif);font-size:clamp(18px,3vw,24px);font-style:italic;
  color:var(--text2);line-height:1.6;max-width:560px;margin:0 auto 56px;
  opacity:0;transform:translateY(20px);animation:fadeUp .8s var(--ease-out-expo) .8s forwards}
.cover-meta{display:flex;gap:48px;justify-content:center;flex-wrap:wrap;
  opacity:0;transform:translateY(20px);animation:fadeUp .8s var(--ease-out-expo) 1s forwards}
.cover-meta-item{text-align:center}
.cover-meta-num{font-family:var(--serif);font-size:42px;font-weight:400;color:var(--text);line-height:1}
.cover-meta-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone);margin-top:8px}
.cover-meta-divider{width:1px;height:48px;background:var(--border);align-self:center}
.cover-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);
  opacity:0;animation:fadeUp .8s var(--ease-out-expo) 1.2s forwards,float 3s ease-in-out 2s infinite}

@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes scaleX{to{opacity:1;transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* TAB BAR */
.tab-bar{position:sticky;top:80px;z-index:90;display:flex;justify-content:center;gap:0;
  padding:0 32px;background:var(--bg);border-bottom:1px solid var(--border);transition:background .6s var(--ease-out-expo)}
.tab-btn{padding:16px 32px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;
  color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;
  cursor:pointer;transition:all .4s var(--ease-out-expo);font-family:var(--sans)}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TAB PANELS */
.tab-panel{display:none}
.tab-panel.active{display:block}

/* VIDEO - Horizontal Scroll Row */
.video-row{display:flex;gap:16px;overflow-x:auto;padding:20px 0;margin:32px 0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.video-row::-webkit-scrollbar{height:3px}
.video-row::-webkit-scrollbar-thumb{background:var(--accent);opacity:.3;border-radius:2px}
.video-item{flex:0 0 auto;scroll-snap-align:start}
.video-item video{width:280px;height:210px;border-radius:12px;background:#060A12;display:block;object-fit:cover}
.video-caption{font-size:11px;color:var(--stone);margin-top:8px;font-style:italic;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}

/* CURRICULUM */
.curr{padding:96px 32px 80px;max-width:1080px;margin:0 auto}
.curr-header{text-align:center;margin-bottom:72px}
.curr-title{font-family:var(--serif);font-size:clamp(32px,6vw,48px);font-weight:400;margin-bottom:12px}
.curr-sub{font-size:14px;color:var(--stone);letter-spacing:.04em;margin-bottom:48px}

/* Stage cards - Double Bezel */
.curr-stage{background:var(--bg3);border:1px solid var(--border);border-radius:24px;padding:32px 32px 28px;
  margin-bottom:28px;box-shadow:var(--shadow-s);transition:transform .6s var(--ease-out-expo),box-shadow .6s var(--ease-out-expo)}
.curr-stage:hover{transform:translateY(-4px);box-shadow:var(--shadow-m)}
.curr-stage.current{border-color:var(--practicing);border-width:1.5px}
.curr-stage.locked-stage{opacity:.5}
.curr-stage-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.curr-stage-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:#fff;flex-shrink:0}
.curr-stage-name{font-family:var(--serif);font-size:22px;font-weight:400}
.curr-badge{font-size:10px;padding:4px 12px;border-radius:100px;letter-spacing:.08em;font-weight:500}
.curr-badge.done{background:var(--accent-bg);color:var(--mastered)}
.curr-badge.now{background:rgba(232,115,90,.12);color:var(--practicing)}
.curr-stage-desc{font-size:13px;color:var(--stone);margin-bottom:20px;line-height:1.7}
.curr-groups{display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
.curr-group-name{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:10px}
.curr-items{display:flex;flex-wrap:wrap;gap:8px 20px}
.curr-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);position:relative;cursor:default}
.curr-item.mastered{color:var(--text);font-weight:500}
.curr-item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.curr-item-date{font-size:10px;color:var(--stone);margin-left:4px}
.curr-item-diary{font-size:10px;color:var(--accent);margin-left:6px;cursor:pointer;opacity:.7;transition:opacity .3s var(--ease-out-expo)}
.curr-item-diary:hover{opacity:1}

/* Stage criteria */
.curr-criteria{border-top:1px solid var(--border);padding-top:16px;margin-top:8px}
.curr-criteria-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:8px}
.curr-criteria-text{font-size:13px;color:var(--text2);line-height:1.7}
.curr-time{font-size:11px;color:var(--stone);margin-top:8px;font-style:italic}

/* Current focus */
.curr-focus{background:var(--bg3);border:1px solid var(--border);border-radius:24px;padding:32px;margin-top:40px}
.curr-focus-title{font-family:var(--serif);font-size:22px;font-weight:400;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.curr-focus-list{display:flex;flex-direction:column;gap:16px}
.curr-focus-item{display:flex;gap:14px;align-items:flex-start}
.curr-focus-tag{font-size:10px;padding:3px 10px;border-radius:100px;font-weight:600;letter-spacing:.06em;flex-shrink:0;margin-top:2px}
.curr-focus-tag.p0{background:rgba(212,168,83,.12);color:var(--mastered)}
.curr-focus-tag.p1{background:rgba(232,115,90,.12);color:var(--practicing)}
.curr-focus-tag.p2{background:var(--border);color:var(--stone)}
.curr-focus-name{font-size:14px;font-weight:500;margin-bottom:4px}
.curr-focus-drill{font-size:13px;color:var(--text2);line-height:1.6}

/* DIARY CHAPTERS */
.chapter{padding:96px 32px;max-width:800px;margin:0 auto;border-bottom:1px solid var(--border)}
.chapter:last-child{border-bottom:none}
.chapter-head{margin-bottom:48px}
.chapter-num{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);font-weight:500;display:block;margin-bottom:12px}
.chapter-date{font-family:var(--serif);font-size:clamp(28px,5vw,40px);font-weight:400;color:var(--text);margin-bottom:8px}
.chapter-subtitle{font-size:15px;color:var(--text2);font-weight:400}

/* Photos - Horizontal Scroll Row (same as video) */
.photo-strip{display:flex;gap:16px;overflow-x:auto;padding:20px 0;margin:32px 0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.photo-strip::-webkit-scrollbar{height:3px}
.photo-strip::-webkit-scrollbar-thumb{background:var(--accent);opacity:.3;border-radius:2px}
.photo-frame{flex:0 0 auto;scroll-snap-align:start;position:relative;overflow:hidden;border-radius:12px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--border);padding:4px;
  transition:transform .6s var(--ease-out-expo),box-shadow .6s var(--ease-out-expo)}
.photo-frame:hover{transform:translateY(-4px);box-shadow:var(--shadow-m)}
.photo-frame img{width:280px;height:210px;object-fit:cover;border-radius:8px;display:block;transition:transform .8s var(--ease-out-expo)}
.photo-frame:hover img{transform:scale(1.03)}
.photo-caption{font-size:11px;color:var(--stone);margin-top:8px;font-style:italic;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}

/* Breakthrough */
.breakthrough{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:28px;margin:40px 0}
.breakthrough-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:10px}
.breakthrough-text{font-family:var(--serif);font-size:18px;color:var(--text);line-height:1.6;font-style:italic}

/* Quote Block */
.quote-block{position:relative;padding:40px 0 40px 32px;margin:48px 0}
.quote-mark{position:absolute;left:0;top:0;font-family:var(--serif);font-size:72px;color:var(--accent);line-height:1;opacity:.15}
.quote-text{font-family:var(--serif);font-size:clamp(16px,2.5vw,20px);color:var(--text2);line-height:1.8;font-style:italic}
.feeling-text{white-space:pre-wrap}

/* Skills Row */
.skills-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.skill-tag{font-size:11px;padding:6px 14px;border-radius:100px;background:var(--accent-bg);color:var(--accent);font-weight:500;letter-spacing:.04em}

/* Stars */
.stars{display:flex;gap:6px;margin-top:16px}
.star{width:8px;height:8px;border-radius:50%;background:var(--sand);opacity:.4}
.star.filled{background:var(--accent)}

/* Guidance Toggle */
.guidance-wrap{margin:32px 0;border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:all .4s var(--ease-out-expo)}
.guidance-toggle{width:100%;padding:20px 24px;background:var(--bg3);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;font-family:var(--sans);font-size:13px;color:var(--text2);font-weight:500;transition:background .3s var(--ease-out-expo)}
.guidance-toggle:hover{background:rgba(212,168,83,.06)}
.chevron{transition:transform .4s var(--ease-out-expo)}
.guidance-wrap.open .chevron{transform:rotate(180deg)}
.guidance-body{max-height:0;overflow:hidden;transition:max-height .5s var(--ease-out-expo)}
.guidance-wrap.open .guidance-body{max-height:500px}
.guidance{padding:24px;font-size:14px;color:var(--text2);line-height:1.8}

/* Coach Block */
.coach-block{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:28px;margin:32px 0}
.coach-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:12px}
.coach-text{font-size:14px;color:var(--text2);line-height:1.8}

/* Goal */
.goal-block{background:var(--accent-bg);border:1px solid rgba(212,168,83,.15);border-radius:20px;padding:28px;margin:32px 0}
.goal-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:12px}
.goal-text{font-size:14px;color:var(--text);line-height:1.7}

/* Skill Map */
.skill-map{padding:96px 32px 80px;max-width:960px;margin:0 auto}
.map-title{font-family:var(--serif);font-size:clamp(28px,5vw,40px);font-weight:400;text-align:center;margin-bottom:12px}
.map-sub{font-size:14px;color:var(--stone);text-align:center;margin-bottom:40px}
.map-legend{display:flex;justify-content:center;gap:32px;margin-bottom:48px}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.map-dot{width:10px;height:10px;border-radius:50%}
.map-dot.mastered{background:var(--mastered)}
.map-dot.practicing{background:var(--practicing)}
.map-dot.locked{background:var(--locked)}
#map-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(6,10,18,.95);backdrop-filter:blur(20px);
  display:none;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .4s var(--ease-out-expo)}
.lightbox.active{display:flex;opacity:1}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain}
.lb-close{position:absolute;top:24px;right:32px;width:40px;height:40px;border:none;background:rgba(212,168,83,.15);
  border-radius:50%;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s var(--ease-out-expo)}
.lb-close:hover{background:rgba(212,168,83,.25)}

/* Back to Top */
.btt{position:fixed;bottom:32px;right:32px;width:44px;height:44px;border:none;background:var(--bg3);
  border:1px solid var(--border);border-radius:50%;color:var(--text2);font-size:18px;cursor:pointer;
  box-shadow:var(--shadow-m);opacity:0;pointer-events:none;transition:all .4s var(--ease-out-expo);z-index:90}
.btt.visible{opacity:1;pointer-events:auto}
.btt:hover{transform:translateY(-4px);box-shadow:var(--shadow-l);color:var(--text)}

/* Footer */
.footer{padding:48px 32px;text-align:center;border-top:1px solid var(--border)}
.footer-text{font-size:11px;letter-spacing:.1em;color:var(--stone);text-transform:uppercase}

/* Reveal Animation */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease-out-expo),transform .8s var(--ease-out-expo)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-delay-1{transition-delay:.1s}
.reveal-delay-2{transition-delay:.2s}
.reveal-delay-3{transition-delay:.3s}

/* Mobile */
@media(max-width:768px){
  .nav{top:16px;padding:10px 20px;gap:20px}
  .nav-right{gap:16px}
  .nav-right a{font-size:10px}
  .cover{padding:60px 24px 40px}
  .cover-watermark{font-size:150px}
  .cover-meta{gap:32px}
  .cover-meta-num{font-size:32px}
  .cover-meta-divider{height:36px}
  .tab-bar{top:72px}
  .tab-btn{padding:14px 20px;font-size:10px}
  .chapter{padding:64px 24px}
  .photo-frame img{width:240px;height:180px}
  .photo-caption{max-width:240px}
  .video-item video{width:240px;height:180px}
  .curr{padding:64px 24px 60px}
  .skill-map{padding:64px 24px 60px}
  .footer{padding:32px 24px}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <span class="nav-brand">Climbing Path</span>
  <div class="nav-right">
    <a onclick="switchTab('curriculum')" id="nav-curriculum" class="active">课程</a>
    <a onclick="switchTab('diary')" id="nav-diary">日记</a>
    <a onclick="switchTab('diary');setTimeout(function(){document.getElementById('skill-map').scrollIntoView({behavior:'smooth'})},100)">成长</a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">&#9789;</button>
  </div>
</nav>

<section class="cover">
  <div class="cover-watermark">XVI</div>
  <div class="cover-eyebrow reveal">Climbing Path &middot; 2026</div>
  <h1 class="reveal reveal-delay-1">派大涛·攀岩修炼</h1>
  <div class="cover-line reveal reveal-delay-2"></div>
  <p class="cover-quote reveal reveal-delay-2">"快乐快乐，不是说自己多强，<br>是那种一点点探索一点点进步的掌控感。"</p>
  <div class="cover-meta reveal reveal-delay-3">
    <div class="cover-meta-item"><div class="cover-meta-num">16</div><div class="cover-meta-label">训练</div></div>
    <div class="cover-meta-divider"></div>
    <div class="cover-meta-item"><div class="cover-meta-num">66</div><div class="cover-meta-label">天</div></div>
    <div class="cover-meta-divider"></div>
    <div class="cover-meta-item"><div class="cover-meta-num">23</div><div class="cover-meta-label">技能</div></div>
  </div>
  <div class="cover-scroll">Scroll</div>

// Tech diary auto-index
var techDiary=(function(){
  var map={};
  ST.forEach(function(cat){
    cat.skills.forEach(function(s){
      if(s.date){
        map[s.name]={date:s.date,status:s.status};
      }
    });
  });
  D.forEach(function(entry){
    if(entry.skills){
      entry.skills.forEach(function(sk){
        var short=sk.split('/')[0];
        if(!map[short]){
          map[short]={date:entry.date.slice(5),status:'practicing'};
        }
      });
    }
  });
  return map;
})();

function fmtDate(d){
  var p=d.split('-');
  return p[1]+'月'+p[2]+'日';
}

function starDots(n){
  var h='';
  for(var i=0;i<3;i++) h+='<div class="star'+(i<n?' filled':'')+'"></div>';
  return '<div class="stars">'+h+'</div>';
}

function renderPhotos(t){
  if(!t.photos||!t.photos.length)return '';
  var frames=t.photos.map(function(p,i){
    var cap=t.captions&&t.captions[i]?'<div class="photo-caption">'+t.captions[i]+'</div>':'';
    return '<div class="photo-frame reveal"><img src="'+P+p+'" alt="" loading="lazy">'+cap+'</div>';
  }).join('');
  return '<div class="photo-strip">'+frames+'</div>';
}

function renderVideos(t){
  if(!t.videos||!t.videos.length)return '';
  var html=t.videos.map(function(v,vi){
    var cap=t.videoCaptions&&t.videoCaptions[vi]?'<div class="video-caption">'+t.videoCaptions[vi]+'</div>':'';
    return '<div class="video-item"><video controls playsinline preload="metadata" src="'+P+v+'"></video>'+cap+'</div>';
  }).join('');
  return '<div class="video-row reveal">'+html+'</div>';
}

        var dotColor=td.status==='mastered'?'var(--mastered)':td.status==='practicing'?'var(--practicing)':'var(--locked)';
        var diaryLink=td.date?'<span class="curr-item-diary" onclick="goToDiary(\''+td.date+'\')">日记</span>':'';
        html+='<div class="curr-item'+(td.status==='mastered'?' mastered':'')+'">'
          +'<div class="curr-item-dot" style="background:'+dotColor+'"></div>'
          +'<span>'+item+'</span>'
          +(td.date?'<span class="curr-item-date">'+td.date+'</span>':'')
          +diaryLink
          +'</div>';
      });
      html+='</div></div>';
    });
    html+='</div>'
      +'<div class="curr-criteria">'
      +'<div class="curr-criteria-label">通关标准</div>'
      +'<div class="curr-criteria-text">'+c.criteria+'</div>'
      +'</div>'
      +(c.time?'<div class="curr-time">'+c.time+'</div>':'')
      +'</div>';
  });
  // Current focus
  var focusItems=[
    {tag:"P0",name:"腿部发力意识",drill:"每攀前默念3遍'腿推不是手拉'，每步移动后检查手臂是否伸直"},
    {tag:"P0",name:"脚法基本功",drill:"V1-V2线路刻意练习外侧缘踩点+拧转，每步定格2秒"},
    {tag:"P1",name:"旗式自动化",drill:"熟线上强制每步做旗式，练到不需要思考"},
    {tag:"P2",name:"动态控制",drill:"每周尝试1条含动态动作的V2-V3线路"}
  ];
  html+='<div class="curr-focus reveal">'
    +'<div class="curr-focus-title">🎯 当前训练重点</div>'
    +'<div class="curr-focus-list">';
  focusItems.forEach(function(f){
    html+='<div class="curr-focus-item">'
      +'<div class="curr-focus-tag '+f.tag.toLowerCase()+'">'+f.tag+'</div>'
      +'<div><div class="curr-focus-name">'+f.name+'</div><div class="curr-focus-drill">'+f.drill+'</div></div>'
      +'</div>';
  });
  html+='</div></div>';
  el.innerHTML=html;
}

function renderSkillMap(){
  var el=document.getElementById('map-container');
  var html='';
  ST.forEach(function(cat){
    html+='<div class="curr-stage reveal"><div class="curr-stage-head"><div class="curr-stage-name">'+cat.name+'</div></div><div class="curr-items" style="flex-direction:column;gap:12px">';
    cat.skills.forEach(function(s){
      var dotColor=s.status==='mastered'?'var(--mastered)':s.status==='practicing'?'var(--practicing)':'var(--locked)';
      var diaryLink=s.date?'<span class="curr-item-diary" onclick="goToDiary(\''+s.date+'\')">日记</span>':'';
      html+='<div class="curr-item'+(s.status==='mastered'?' mastered':'')+'" style="padding:8px 0">'
        +'<div class="curr-item-dot" style="background:'+dotColor+'"></div>'
        +'<span>'+s.name+'</span>'
        +(s.date?'<span class="curr-item-date">'+s.date+'</span>':'')
        +diaryLink
        +'</div>';
    });
    html+='</div></div>';
  });
  el.innerHTML=html;
}

function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
  document.getElementById('tb-'+t).classList.add('active');
  document.getElementById('panel-'+t).classList.add('active');
  document.getElementById('nav-'+t).classList.add('active');
  document.querySelectorAll('.nav-right a').forEach(function(a){if(a.id!=='nav-'+t)a.classList.remove('active')});
  if(t==='diary'){setTimeout(function(){window.scrollTo({top:document.getElementById('tab-bar').offsetTop,behavior:'smooth'});onScroll()},50)}
  else{setTimeout(onScroll,50)}
}

function goToDiary(dateSuffix){
  switchTab('diary');
  setTimeout(function(){
    var chapters=document.querySelectorAll('.chapter');
    for(var i=0;i<chapters.length;i++){
      var dateEl=chapters[i].querySelector('.chapter-date');
      if(dateEl&&dateEl.textContent.indexOf(dateSuffix)!==-1){
        chapters[i].scrollIntoView({behavior:'smooth',block:'start'});
        break;
      }
    }
  },100);
}

function openLB(src){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeLB(){
  document.getElementById('lb').classList.remove('active');
  document.body.style.overflow='';
}

function toggleTheme(){
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',isDark?'':'dark');
  localStorage.setItem('theme',isDark?'':'dark');
}

// Scroll effects
var nav=document.getElementById('nav');
var btt=document.getElementById('btt');

function onScroll(){
  var y=window.scrollY;
  if(y>100)nav.classList.add('scrolled');else nav.classList.remove('scrolled');
  if(y>600)btt.classList.add('visible');else btt.classList.remove('visible');
  var reveals=document.querySelectorAll('.reveal:not(.visible)');
  reveals.forEach(function(el){
    var rect=el.getBoundingClientRect();
    if(rect.top<window.innerHeight*0.88)el.classList.add('visible');
  });
}

window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);

// Init
var savedTheme=localStorage.getItem('theme');
if(savedTheme==='dark')document.documentElement.setAttribute('data-theme','dark');
renderCurriculum();
renderChapters();
renderSkillMap();
onScroll();
</script>
</body>
</html>
